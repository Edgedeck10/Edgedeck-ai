name: Refresh and publish EdgeDeck
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: edgedeck-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify model and settlement logic
        run: python -m unittest test_pipeline.py
      - name: Collect scores, grade history, calibrate predictions
        run: python pipeline.py
      - name: Preserve prediction history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh EdgeDeck data and outcome history'
            git push
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public dashboard
        run: |
          mkdir -p _site/data/classic
          cp index.html style.css app.js manifest.webmanifest icon.svg _site/
          cp data/classic/latest.json data/classic/history.json _site/data/classic/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish free GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
