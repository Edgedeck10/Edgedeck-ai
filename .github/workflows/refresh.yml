name: Refresh and publish EdgeDeck
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: edgedeck-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify model and settlement logic
        run: |
          python -m unittest discover -p 'test_*.py'
          node --check app.js
          node --check analysis-ui.js
          node --check sports-ui.js
          node --check picks-ui.js
          node test_picks_ui.cjs
          node test_ui.cjs
      - name: Collect scores, grade history, calibrate predictions
        run: python pipeline.py
      - name: Preserve prediction history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh EdgeDeck data and outcome history'
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public dashboard
        run: |
          mkdir -p _site/data
          cp index.html style.css app.js analysis-ui.js sports-ui.js picks-ui.js manifest.webmanifest icon.svg _site/
          cp data/latest.json.gz data/feed_status.json data/history.json data/shortlist_history.json data/daily_history.json data/research_ticket_history.json data/perfect_ticket_history.json data/history_manifest.json _site/data/
          cp -r data/history_archive _site/data/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish free GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
